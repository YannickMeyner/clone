services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:3000"
    env_file:
      - .env

  backend:
    build:
      context: ./server/Tetrispp
      dockerfile: ./Tetrispp/Dockerfile
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env

  db:
    image: postgres:latest
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
